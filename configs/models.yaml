# Models used at each stage, as set in the notebooks.
# Prompts for each role: prompts/ALL_PROMPTS.md

graph_construction:
  page_ocr:
    model: gemini-2.5-pro              # alternative path: gpt-5.3-chat-latest
    input: page image, 300 DPI
    notebook: notebooks/01_graph_construction/1b_extract_page_text_ocr.ipynb
  text_to_graph_json:
    model: unknown                      # the notebook tries several Gemini models; the run that produced data/graphs is not recorded
    notebook: notebooks/01_graph_construction/1c_text_to_graph_json.ipynb

case_generation:
  reference_path_generator:
    model: gpt-5.5-pro
    api: openai-responses
    max_output_tokens: 20000
    response_format: json_schema (strict: false)
    cases_per_call: 1
    notebook: notebooks/02_cases/2a_generate_reference_paths.ipynb
  backstory_generator:
    model: gpt-5.5
    api: openai-responses
    notebook: notebooks/02_cases/2b_generate_virtual_patient_backstories.ipynb

virtual_patient:                        # also acts as the answer normalizer (returns YES / NO / NO_ANSWER)
  S1:
    model: gpt-4.1-mini                 # code default (env OPENAI_YESNO_MODEL); not written to the S1 run logs
    temperature: 0
    max_output_tokens: 25
  S2_S3:
    model: gpt-4o-mini
    temperature: 0
    max_output_tokens: 25

navigators:                             # S2 and S3 only; S1 uses no navigator LLM
  temperature: 0
  models:
    - {provider: openai, model: gpt-4o}
    - {provider: openai, model: gpt-4.1}
    - {provider: openai, model: gpt-4o-mini}
    - {provider: gemini, model: gemini-2.5-flash}
    - {provider: gemini, model: gemini-2.5-pro}
    - {provider: gemini, model: gemini-3.5-flash}
